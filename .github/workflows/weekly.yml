name: Weekly ephemerides

# Every Monday, a set for the 7 days from 00:00 UTC, made from the newest TLE,
# checked by weekly.py and committed. Run it by hand from the Actions tab; tick
# "dry run" to make and check a set without committing it.
on:
  schedule:
    - cron: "17 0 * * 1"          # Mondays 00:17 UTC (07:17 ICT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make and check a set, but commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-ephemerides
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # DE421 for the sunlit columns, from NAIF, checked against a pinned hash.
      - uses: actions/cache@v6
        with:
          path: de421.bsp
          key: de421-08b20db2ae224886
      - name: Get DE421
        run: |
          [ -f de421.bsp ] || curl -fsSL --retry 3 -o de421.bsp \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/a_old_versions/de421.bsp
          echo "08b20db2ae22488650641c5a9033e5bfda4b1c4b440cfeaf20f621cfa18ecdb3  de421.bsp" | sha256sum --check

      - name: Make and check this week's set
        id: make
        run: python weekly.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep the dry run's files
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run
          path: _dry-run/

      - name: Commit the set
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add the weekly set ${{ steps.make.outputs.set }}"
          git push
